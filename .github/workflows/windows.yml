name: Build Windows diagnostic
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.11.1
      - run: python tests/run_ci.py
      - name: Build diagnostic executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ChairLight-Diagnostic main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChairLight-Diagnostic-Windows
          path: dist/ChairLight-Diagnostic.exe
          if-no-files-found: error
          retention-days: 30
